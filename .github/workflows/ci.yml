name: Skill CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run validate
      - run: bun run validate:schema
      - run: bun run generate:platform-catalog && git diff --exit-code -- platforms/platform-catalog.json
      - run: bun test
        env:
          CLAUDE_SKILLS_DIR: ${{ runner.temp }}/decisionops-test-skills
